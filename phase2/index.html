<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body>
    <div id="alertBox"></div>
    <header>
        <nav class="navbar navbar-expand-lg bg-dark navbar-dark rounded-3 mt-1">
            <div class="container-fluid d-flex justify-content-between align-items-center">
                <a class="navbar-brand" href="#"><span class="text-primary">Expense</span> Tracker</a>
                <button id="darkModeBtn" class="btn btn-outline-light btn-sm">🌙</button>
            </div>
        </nav>
    </header>
    <main>
        <div class="container mt-4">
            <div id="spinner" class="text-center my-4" style="display: none;">
                <div class="spinner-border text-primary" role="status">
                    <span class="visually-hidden">Loading...</span>
                </div>
            </div>
            <div class="summary-grid mb-4">
                <div class="card text-center">
                    <div class="card-body">
                        <div class="text-muted small">Total</div>
                        <div class="fs-2 fw-bold" id="total">0.00</div>
                    </div>
                </div>
                <div class="card text-center">
                    <div class="card-body">
                        <div class="text-muted small">Number of expenses</div>
                        <div class="fs-2 fw-bold" id="count">0</div>
                    </div>
                </div>
                <div class="card text-center">
                    <div class="card-body">
                        <div class="text-muted small">Highest expense</div>
                        <div class="fs-2 fw-bold" id="highest">0.00</div>
                        <div class="text-muted small" id="highest-title"></div>
                    </div>
                </div>
            </div>

            <div class="card mb-4 mt-4 px-4">
                <div class="card-body  ">
                    <h5 class="card-title mb-3">Add <span class="text-primary">Expense</span></h5>
                    <form id="expenseForm">
                        <div class="row g-3">

                            <div class="col-12 col-md-6 col-lg-4">
                                <label class="form-label" for="title">Title</label>
                                <input class="form-control" id="title" type="text" placeholder="Lunch" required />
                            </div>

                            <div class="col-12 col-md-6 col-lg-3">
                                <label class="form-label" for="amount">Amount</label>
                                <input class="form-control" id="amount" type="number" step="0.01" placeholder="4.50"
                                    required />
                            </div>

                            <div class="col-12 col-md-6 col-lg-3">
                                <label class="form-label" for="category">Category</label>
                                <select class="form-select" id="category" required>
                                    <option value="" selected>Select Category</option>
                                    <option value="Food">Food</option>
                                    <option value="Transport">Transport</option>
                                    <option value="Bills">Bills</option>
                                    <option value="Entertainment">Entertainment</option>
                                    <option value="Other">Other</option>
                                </select>
                            </div>

                            <div class="col-12 col-md-6 col-lg-2">
                                <label class="form-label" for="date">Date</label>
                                <input class="form-control" id="date" type="date" required />
                            </div>

                            <div class="col-12">
                                <button class="btn btn-primary" id="submitButton" type="submit">Add expense</button>
                                <button class="btn btn-secondary d-none" id="cancelButton" type="button">Cancel</button>
                            </div>

                        </div>
                    </form>
                </div>
            </div>
            <div class="card">
                <div
                    class="card-header d-flex flex-column flex-sm-row justify-content-between align-items-start align-items-sm-center gap-2">
                    <span class="fw-bold">Expenses</span>

                    <div class="d-flex align-items-center gap-2">
                        <label class="form-label mt-2 fw-medium text-primary" for="filterCategory">Category</label>
                        <select class="form-select" aria-label="Category" id="filterCategory">
                            <option value="All">All</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Bills">Bills</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover mb-0 align-middle">
                            <thead>
                                <tr>
                                    <th class="fw-normal">Title</th>
                                    <th class="fw-normal" id="sortAmount" style="cursor: pointer;">
                                        Amount <span id="sortArrow">↕</span>
                                    </th>
                                    <th class="fw-normal">Category</th>
                                    <th class="fw-normal">Date</th>
                                    <th class="fw-normal text-end">Action</th>
                                </tr>
                            </thead>
                            <tbody id="expensesTable"></tbody>
                        </table>
                    </div>
                </div>
            </div>

    </main>
    <div class="modal fade" id="editModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Edit <span class="text-primary">Expense</span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editForm">
                        <input type="hidden" id="editId">
                        <div class="mb-3">
                            <label class="form-label">Title</label>
                            <input type="text" class="form-control" id="editTitle" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Amount</label>
                            <input type="number" step="0.01" class="form-control" id="editAmount" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Category</label>
                            <select class="form-select" id="editCategory" required>
                                <option value="Food">Food</option>
                                <option value="Transport">Transport</option>
                                <option value="Bills">Bills</option>
                                <option value="Entertainment">Entertainment</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Date</label>
                            <input type="date" class="form-control" id="editDate" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" form="editForm" class="btn btn-primary">Save</button>
                </div>
            </div>
        </div>
    </div>
    <footer></footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
